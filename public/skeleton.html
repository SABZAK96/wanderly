<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Wanderly</title>
    <link
      href="https://cdn.jsdelivr.net/npm/daisyui@5"
      rel="stylesheet"
      type="text/css"
    />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,200..1000;1,200..1000&family=Open+Sans:ital,wght@0,300..800;1,300..800&family=Quicksand:wght@300..700&display=swap"
      rel="stylesheet"
    />
    <style>
      /* !important: Tailwind's CDN JIT script injects its own html{font-family}
         reset at runtime, after this stylesheet loads - same specificity, so
         without !important it wins the cascade and silently overrides this */
      html {
        font-family: "Quicksand", sans-serif !important;
        font-optical-sizing: auto;
      }
      /* mobile nav dropdown items */
      .nav-dropdown li > a {
        border-radius: 0.75rem;
        font-weight: 500;
        /* daisyUI's default menu padding is too tight for a touch dropdown */
        padding: 0.6rem 0.75rem;
      }
      .nav-dropdown li > a:hover {
        background: #eeedfe;
        color: #534ab7;
      }
    </style>
  </head>
  <body class="bg-base-200 min-h-screen flex flex-col">
    <!-- navbar -->
    <div
      class="navbar bg-base-100 shadow-sm sticky top-0 z-20 px-4 lg:px-8"
      style="background-color: #534ab7; color: white"
    >
      <div class="navbar-start">
        <div class="dropdown">
          <div tabindex="0" role="button" class="btn btn-ghost lg:hidden">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              class="h-5 w-5"
              fill="none"
              viewBox="0 0 24 24"
              stroke="currentColor"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M4 6h16M4 12h8m-8 6h16"
              />
            </svg>
          </div>
          <ul
            tabindex="-1"
            class="menu menu-sm dropdown-content nav-dropdown bg-base-100 text-base-content rounded-2xl z-1 mt-3 w-52 p-2 gap-0.5 shadow-lg border border-base-200"
          >
            <li><a href="plan.html">Plan</a></li>
            <li><a href="calendar.html">Calendar</a></li>
            <li><a href="expense.html">Expense</a></li>
            <li><a href="packing.html">Packing</a></li>
          </ul>
        </div>
        <a href="plan.html" class="btn btn-ghost text-xl">Wanderly</a>
        <div class="hidden lg:flex">
          <ul class="menu menu-horizontal px-1">
            <li><a href="plan.html">Plan</a></li>
            <li><a href="calendar.html">Calendar</a></li>
            <li><a href="expense.html">Expense</a></li>
            <li><a href="packing.html">Packing</a></li>
          </ul>
        </div>
      </div>

      <div class="navbar-end gap-2">
        <div class="dropdown dropdown-end">
          <div
            tabindex="0"
            role="button"
            class="btn btn-ghost btn-circle avatar"
          >
            <div class="w-10 h-10 rounded-full font-semibold flex items-center justify-center" style="background-color: #44228f;">
              <span id="initial" class="text-lg" style="color: #e0dbfb;"></span>
            </div>
          </div>
          <ul
            tabindex="-1"
            class="menu menu-sm dropdown-content bg-base-100 rounded-box text-base-content z-1 mt-3 w-52 p-2 shadow"
          >
            <li>
              <a id="navProfile"> Profile </a>
            </li>
            <li><a id="navSettings">Settings</a></li>
            <li><a id="navLogout">Logout</a></li>
          </ul>
        </div>
      </div>
    </div>
    <!-- navbar end -->

    <script src="scripts/navbar.js"></script>
  </body>
</html>
